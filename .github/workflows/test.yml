# Modified for the HealthBox distribution; differs from MediKeep v0.68.0. See NOTICE and MODIFICATIONS.md.
name: HealthBox Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.0'
  PYTHON_VERSION: '3.12'
  DO_NOT_TRACK: '1'

jobs:
  scope:
    name: Classify safe documentation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the fail-closed change classifier
        run: python -m unittest discover -s tests/security -p test_healthbox_ci_scope.py -v
      - name: Classify changes (unknown is full)
        id: detect
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/healthbox-ci-scope.py --event "$CI_EVENT" --head "$CI_SHA" \
            --before "$CI_BEFORE" --pr-base "$CI_PR_BASE" --github-output "$GITHUB_OUTPUT"

  frontend-tests:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build:check

  backend-tests:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TESTING: '1'
      DATABASE_URL: sqlite:///test_database.db
      SKIP_MIGRATIONS: 'true'
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install local parser runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim poppler-utils fonts-noto-cjk
      - run: python -m pip install -r requirements.txt pytest-cov
      - name: Generate isolated test credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SECRET_KEY={secrets.token_hex(32)}\n')
              env.write(f'ADMIN_DEFAULT_PASSWORD={secrets.token_urlsafe(32)}\n')
          PY
      - name: Full backend suite with explicit 70 percent coverage gate
        run: python -m pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=70

  synthetic-browser:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_SYNTHETIC_BROWSER_E2E: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-e2e.txt pytest-cov
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: npm run build:check
        working-directory: frontend
      - name: Synthetic source, review, commit, trend, export and rollback
        run: python -m pytest tests/e2e/test_household_health_browser.py -o addopts= -v
